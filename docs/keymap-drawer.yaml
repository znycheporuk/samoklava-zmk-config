# Generated reference card for config/corne.keymap.
# Physical geometry in docs/samoklava-layout.json was measured from a photo
# of the actual board: 36 keys, 3x5+3, column stagger (pinky -> inner index)
# 0.84 / 0.20 / 0.00 / 0.23 / 0.38 u, thumbs on a descending arc.
#
# Regenerate:
#   keymap parse -z config/corne.keymap > /tmp/kd.yaml   # then re-apply the
#   # 36-key trim (drop indices 0,11,12,23,24,35) and layer renames, or just
#   # hand-edit this file
#   keymap draw docs/keymap-drawer.yaml > docs/keymap.svg
